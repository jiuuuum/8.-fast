<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1 class="app-title">할 일 관리</h1>

    <!-- 입력 영역 -->
    <section class="input-card">
      <input type="text" id="todo-input" class="todo-input" placeholder="할 일을 입력하세요" />
      <select id="category-select" class="category-select">
        <option value="업무">업무</option>
        <option value="개인">개인</option>
        <option value="공부">공부</option>
      </select>
      <button id="add-btn" class="add-btn">등록</button>
    </section>

    <!-- 진행률 영역 -->
    <section class="progress-card">
      <span id="progress-text">완료 0 / 0 (0%)</span>
    </section>

    <!-- 목록 영역 -->
    <section class="list-card">
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-message" class="empty-message">할 일이 없습니다</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
